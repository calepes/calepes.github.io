<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light only; --ink: #1a1a1a; --paper: #f5f1ea; --accent: #2a2a2a; --muted: #6b5e4f; --light-rule: #c8b99a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Source Serif 4', Georgia, serif; line-height: 1.55; max-width: 900px; margin: 0 auto; padding: 20px; }
  .masthead { text-align: center; padding: 24px 0 16px; border-bottom: 4px double var(--ink); margin-bottom: 32px; }
  .masthead-top { font-family: 'Libre Franklin', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 8px; }
  .masthead h1 { font-family: 'Playfair Display', serif; font-size: clamp(36px, 6vw, 60px); font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin: 8px 0; }
  .masthead-subtitle { font-family: 'Libre Franklin', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--muted); }
  .countries { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 32px 0; }
  .country-card { border: 1px solid var(--light-rule); padding: 20px; text-align: center; transition: transform 0.2s; }
  .country-card:hover { transform: translateY(-2px); }
  .country-card h2 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
  .country-card.colombia h2 { color: #c4841d; }
  .country-card.peru h2 { color: #1a4a6b; }
  .country-card.bolivia h2 { color: #8b1a1a; }
  .country-card .flag { font-size: 14px; font-family: 'Libre Franklin', sans-serif; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 12px; }
  .briefing-list { list-style: none; text-align: left; }
  .briefing-list li { padding: 6px 0; border-bottom: 1px solid var(--light-rule); font-size: 13px; }
  .briefing-list li:last-child { border-bottom: none; }
  .briefing-list a { color: var(--ink); text-decoration: none; font-family: 'Libre Franklin', sans-serif; }
  .briefing-list a:hover { color: var(--accent); text-decoration: underline; }
  .date-label { font-family: 'Libre Franklin', sans-serif; font-weight: 600; }
  .footer { margin-top: 40px; padding-top: 16px; border-top: 2px solid var(--ink); font-family: 'Libre Franklin', sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); text-align: center; }
  @media (max-width: 600px) { .countries { grid-template-columns: 1fr; } }
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  // This script dynamically populates briefing links
  // GitHub Pages serves static files, so we use a known structure
  const countries = [
    { id: 'colombia', name: 'Colombia', folder: 'Colombia' },
    { id: 'peru', name: 'Peru', folder: 'Peru' },
    { id: 'bolivia', name: 'Bolivia', folder: 'Bolivia' }
  ];

  // Parse the briefings-manifest.json if available
  fetch('briefings-manifest.json')
    .then(r => r.json())
    .then(manifest => {
      countries.forEach(country => {
        const list = document.getElementById(country.id + '-list');
        const files = manifest[country.folder] || [];
        if (files.length === 0) {
          list.innerHTML = '<li style="color: var(--muted); font-style: italic;">Sin briefings disponibles</li>';
          return;
        }
        // Sort descending (newest first)
        files.sort().reverse();
        list.innerHTML = files.map(f => {
          const dateStr = f.replace(country.folder + '-', '').replace('.html', '');
          const year = dateStr.substring(0, 4);
          const month = dateStr.substring(4, 6);
          const day = dateStr.substring(6, 8);
          const months = ['', 'Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
          const label = day + ' ' + months[parseInt(month)] + ' ' + year;
          return '<li><a href="' + country.folder + '/' + f + '"><span class="date-label">' + label + '</span></a></li>';
        }).join('');
      });
    })
    .catch(() => {
      // Fallback: show message
      countries.forEach(country => {
        const list = document.getElementById(country.id + '-list');
        list.innerHTML = '<li style="color: var(--muted); font-style: italic;">Cargando...</li>';
      });
    });
});
</script>
</head>
<body>
  <div class="masthead">
    <div class="masthead-top">
      <span>Briefings Ejecutivos</span>
      <span>Edicion Diaria</span>
      <span>Confidencial</span>
    </div>
    <h1>Daily News</h1>
    <div class="masthead-subtitle">Colombia &middot; Peru &middot; Bolivia</div>
  </div>

  <div class="countries">
    <div class="country-card colombia">
      <h2>Colombia</h2>
      <div class="flag">Bogota</div>
      <ul class="briefing-list" id="colombia-list">
        <li style="color: var(--muted); font-style: italic;">Cargando...</li>
      </ul>
    </div>
    <div class="country-card peru">
      <h2>Peru</h2>
      <div class="flag">Lima</div>
      <ul class="briefing-list" id="peru-list">
        <li style="color: var(--muted); font-style: italic;">Cargando...</li>
      </ul>
    </div>
    <div class="country-card bolivia">
      <h2>Bolivia</h2>
      <div class="flag">La Paz</div>
      <ul class="briefing-list" id="bolivia-list">
        <li style="color: var(--muted); font-style: italic;">Cargando...</li>
      </ul>
    </div>
  </div>

  <div class="footer">
    Briefings generados con Claude &mdash; Solo para uso informativo
  </div>
</body>
</html>

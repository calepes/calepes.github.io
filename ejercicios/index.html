<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ejercicios</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="header">
    <button id="backBtn" class="flash-btn ghost back-btn" hidden>‹ Volver</button>
    <h1 id="screenTitle">Ejercicios</h1>
  </header>

  <section id="screen-loading" class="screen">
    <div class="bounce-loader"><span></span><span></span><span></span></div>
  </section>

  <section id="screen-zones" class="screen" hidden>
    <div id="zoneGrid" class="grid"></div>
  </section>

  <section id="screen-list" class="screen" hidden>
    <div id="exerciseGrid" class="grid"></div>
  </section>

  <section id="screen-player" class="screen" hidden>
    <video id="playerVideo" playsinline loop autoplay muted></video>
    <h2 id="playerNombre" class="player-nombre"></h2>
    <div class="speech-wrap">
      <div class="mascot">🦉</div>
      <div id="playerNotas" class="speech-bubble"></div>
    </div>
  </section>

  <div id="errorState" class="alert error" hidden>
    <span class="ic">⚠</span>
    <span>No se pudo cargar.</span>
    <button id="retryBtn" class="flash-btn ghost">Reintentar</button>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>

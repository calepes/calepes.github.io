name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      package_attempt: ${{ steps.package.outputs.attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install publication checks
        run: npm ci --prefix .github/pages --ignore-scripts
      - name: Test publication checks
        run: npm test --prefix .github/pages
      - name: Identify generated content
        id: package
        run: node .github/pages/run.cjs manifest
        env:
          PACKAGE_ATTEMPT: ${{ github.run_attempt }}
      - name: Upload uniquely named package
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: ${{ steps.package.outputs.name }}

  deploy:
    needs: package
    environment:
      name: github-pages
      url: https://apps.lepesqueur.net/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install publication checks
        run: npm ci --prefix .github/pages --ignore-scripts
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Wait for exact package and reconcile previous attempts
        id: gate
        uses: ./.github/pages
        env:
          PUBLICATION_COMMAND: gate
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          PACKAGE_ATTEMPT: ${{ needs.package.outputs.package_attempt }}
      - name: Deploy pinned Pages artifact
        id: deployment
        if: steps.gate.outputs.mode == 'create'
        # Keep the examined lookup implementation paired with @actions/artifact 2.1.3.
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.package.outputs.artifact_name }}
      - name: Verify public commit and content
        run: node .github/pages/run.cjs verify
        env:
          PAGE_URL: https://apps.lepesqueur.net/
          PACKAGE_ATTEMPT: ${{ needs.package.outputs.package_attempt }}
          VERIFIED_RUN: ${{ steps.gate.outputs.verified_run }}
          REUSE_DEPLOYMENT: ${{ steps.gate.outputs.mode == 'verify' }}

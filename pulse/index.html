// ═══════════════════════════════════════
// API LAYER

async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${API_TOKEN}`,
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}

const API = {
  getEntries: (limit = 100) => api(`/api/entries?limit=${limit}`),
  createEntry: (entry) => api("/api/entries", { method: "POST", body: JSON.stringify(entry) }),
  deleteEntry: (id) => api(`/api/entries/${id}`, { method: "DELETE" }),
  getWeekStats: () => api("/api/stats/week"),
  saveCoachLog: (entryId, messages) =>
    api("/api/coach-logs", { method: "POST", body: JSON.stringify({ entry_id: entryId || null, messages }) }),
  getCoachContext: () => api("/api/coach/context"),
  getConfig: () => api("/api/config"),
  updateConfig: (data) => api("/api/config", { method: "PUT", body: JSON.stringify(data) }),
};

const LOCAL_KEY = "pulse-entries-offline";
function getLocal() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch { return []; } }

const font = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif";

function fmtDate(iso) {
  const d = new Date(iso), diff = Date.now() - d;
  if (diff < 60000) return "Ahora";
  if (diff < 3600000) return `${Math.floor(diff / 60000)}m`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h`;
  return d.toLocaleDateString("es", { day: "numeric", month: "short" });
}

const mkG = (t) => ({

const mkN = (t) => ({ ...mkG(t), backdropFilter: "blur(24px) saturate(180%)", WebkitBackdropFilter: "blur(24px) saturate(180%)", borderRadius: 20 });
const mkC = (t, s) => ({
  background: s ? `${t.blue}18` : t.inputBg, backdropFilter: "blur(16px) saturate(180%)", WebkitBackdropFilter: "blur(16px) saturate(180%)",
  borderRadius: 9999, border: `0.5px solid ${s ? t.blue + "40" : t.cardBorder}`,

const cap = (t) => ({ fontSize: 12, fontWeight: 500, letterSpacing: 0.6, textTransform: "uppercase", color: t.lbl3, marginBottom: 10 });
function rv(vis, i) {
  return { opacity: vis ? 1 : 0, transform: vis ? "translateY(0)" : "translateY(14px)", transition: "all 0.5s cubic-bezier(0.25,0.1,0.25,1)", transitionDelay: `${0.06 + i * 0.04}s` };
}

      <div style={{ position: "fixed", bottom: -80, left: -60, width: 300, height: 300, borderRadius: "50%", pointerEvents: "none", background: `radial-gradient(circle, ${t.orbB} 0%, transparent 70%)` }} />

function Chips({ t, options, value, onChange, multi }) {
  const toggle = (id) => multi ? onChange(value.includes(id) ? value.filter((v) => v !== id) : [...value, id]) : onChange(id);
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
      {options.map((o) => {
        const s = multi ? value.includes(o.id) : value === o.id;
        return <button key={o.id} onClick={() => toggle(o.id)} style={mkC(t, s)}>{o.emoji ? `${o.emoji} ` : ""}{o.label}</button>;
      })}
    </div>
  );
}

function Toast({ t, message, type }) {
  if (!message) return null;
  const bg = type === "error" ? `${t.red}20` : `${t.green}20`;
  const color = type === "error" ? t.red : t.green;
  return (
    <div style={{
      position: "fixed", top: 70, left: 20, right: 20, zIndex: 200,
      ...mkG(t), padding: "12px 16px", textAlign: "center",
      border: `0.5px solid ${color}40`, fontSize: 14, color, fontFamily: font,
    }}>{message}</div>
  );
}

// ═══════════════════════════════════════
// COACH
// ═══════════════════════════════════════
const FALLBACK_PROMPT = "Eres un coach ejecutivo experto en liderazgo bajo presión. Tu cliente es Cal, Country Head de Yape Bolivia, que lidia con doble reporte (jefe local en Bolivia y Yape/Perú) con desalineación estratégica y cultural.\n\nTu rol:\n1. Ayúdale a ver la situación desde otro ángulo\n2. Sugiere cómo podría haber respondido mejor\n3. Dale una frase concreta para la próxima vez\n4. Sé directo, práctico y empático\n\nResponde en español. Máximo 3-4 párrafos.";

function CoachChat({ t, situation, entryId, onClose }) {
  const [msgs, setMsgs] = useState([]);
  const [inp, setInp] = useState("");
  const [loading, setLoading] = useState(false);
  const [sysPrompt, setSysPrompt] = useState(null);
  const endRef = useRef(null);

  // Fetch dynamic context-rich prompt on mount
  useEffect(() => {
    (async () => {
      let prompt = FALLBACK_PROMPT;
      try {
        const res = await API.getCoachContext();
        if (res.systemPrompt) prompt = res.systemPrompt;
      } catch {}
      setSysPrompt(prompt);
      if (situation) run(situation, prompt);
    })();
  }, []);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs]);

  async function run(text, promptOverride) {
    const prompt = promptOverride || sysPrompt || FALLBACK_PROMPT;
    const next = [...msgs, { role: "user", content: text }];
    setMsgs(next); setInp(""); setLoading(true);
    try {
      const data = await api("/api/coach/chat", {
        method: "POST",
        body: JSON.stringify({
          system: prompt,
          messages: next.map((m) => ({ role: m.role, content: m.content })),
        }),
      });
      const reply = data.content?.map((c) => c.text || "").join("") || "No pude procesar eso.";
      const updated = [...next, { role: "assistant", content: reply }];
      setMsgs(updated);
      try { await API.saveCoachLog(entryId, updated); } catch {}
    } catch { setMsgs([...next, { role: "assistant", content: "Error de conexión." }]); }
    setLoading(false);
  }

  const can = inp.trim() && !loading;
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", flexDirection: "column", fontFamily: font }}>
      <BG t={t} />
      <div style={{ padding: "12px 20px" }}>
        <div style={{ ...mkN(t), padding: "10px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 20 }}>🧠</span>
            <span style={{ color: t.lbl1, fontWeight: 600, fontSize: 17, letterSpacing: -0.2 }}>Coach</span>
          </div>
          <button onClick={onClose} style={{ ...mkG(t), width: 36, height: 36, borderRadius: 9999, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: t.lbl2, fontSize: 16 }}>✕</button>
        </div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "8px 20px", display: "flex", flexDirection: "column", gap: 10 }}>
        {msgs.length === 0 && !loading && (
          <div style={{ ...mkG(t), padding: 20, textAlign: "center", marginTop: 40 }}>
            <p style={{ fontSize: 28, margin: "0 0 8px" }}>🧠</p>
            <p style={{ fontSize: 15, color: t.lbl2, margin: 0, lineHeight: 1.5 }}>Contame qué pasó o qué estás a punto de enfrentar.</p>
          </div>
        )}
        {msgs.map((m, i) => (
          <div key={i} style={{
            alignSelf: m.role === "user" ? "flex-end" : "flex-start", maxWidth: "85%", padding: "12px 16px",
            borderRadius: m.role === "user" ? "18px 18px 4px 18px" : "18px 18px 18px 4px",
            background: m.role === "user" ? t.blue : t.cardBg,
            backdropFilter: m.role === "user" ? "none" : "blur(20px) saturate(180%)",
            WebkitBackdropFilter: m.role === "user" ? "none" : "blur(20px) saturate(180%)",
            border: m.role === "user" ? "none" : `0.5px solid ${t.cardBorder}`,
            boxShadow: m.role === "user" ? "none" : `${t.cardShadow}, ${t.insetHL}`,
            color: m.role === "user" ? "#FFF" : t.lbl1, fontSize: 15, lineHeight: 1.55, fontFamily: font, whiteSpace: "pre-wrap",
          }}>{m.content}</div>
        ))}
        {loading && <div style={{ alignSelf: "flex-start", ...mkG(t), padding: "12px 16px", color: t.lbl3, fontSize: 15 }}>Pensando...</div>}
        <div ref={endRef} />
      </div>
      <div style={{ padding: "12px 20px 28px" }}>
        <div style={{ ...mkN(t), display: "flex", alignItems: "center", padding: "6px 6px 6px 16px", gap: 8 }}>
          <input value={inp} onChange={(e) => setInp(e.target.value)} onKeyDown={(e) => e.key === "Enter" && can && run(inp.trim())}
            placeholder="Escribí acá..." style={{ flex: 1, background: "none", border: "none", color: t.lbl1, fontSize: 15, fontFamily: font, outline: "none", padding: "8px 0" }} />
          <button onClick={() => can && run(inp.trim())} disabled={!can} style={{
            width: 36, height: 36, borderRadius: 9999, background: can ? t.blue : t.inputBg,
            border: "none", color: "#FFF", fontSize: 16, cursor: can ? "pointer" : "default",
            display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.2s ease",
          }}>↑</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════
function Pulse() {
  const [isDark, setIsDark] = useState(() => typeof window !== "undefined" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  useEffect(() => {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const h = (e) => setIsDark(e.matches);
    mq.addEventListener("change", h);
    return () => mq.removeEventListener("change", h);
  }, []);
  const t = isDark ? dark : light;

  const [view, setView] = useState("home");
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [online, setOnline] = useState(true);
  const [toast, setToast] = useState({ message: "", type: "" });

  // Form
  const [stress, setStress] = useState(0);
  const [reaction, setReaction] = useState("");
  const [triggers, setTriggers] = useState([]);
  const [situation, setSituation] = useState("");

  // Coach & Detail
  const [coachSit, setCoachSit] = useState("");
  const [coachEntryId, setCoachEntryId] = useState(null);
  const [showCoach, setShowCoach] = useState(false);
  const [selEntry, setSelEntry] = useState(null);

  // Stats
  const [stats, setStats] = useState({ count: 0, avgStress: null, goodReactions: 0, badReactions: 0, topTrigger: null });

  // Config
  const [config, setConfig] = useState(null);
  const [dynTriggers, setDynTriggers] = useState(triggerOpts);
  const [dynStress, setDynStress] = useState(stressLevels);
  const [dynReactions, setDynReactions] = useState(reactionOpts);

  // Settings form
  const [cfgName, setCfgName] = useState("");
  const [cfgRole, setCfgRole] = useState("");
  const [cfgContext, setCfgContext] = useState("");
  const [cfgPersonality, setCfgPersonality] = useState("");
  const [saving, setSaving] = useState(false);

  // Reveal
  const [vis, setVis] = useState(false);
  useEffect(() => { setVis(false); const tm = setTimeout(() => setVis(true), 60); return () => clearTimeout(tm); }, [view]);
  const r = (i) => rv(vis, i);

  // Show toast
  function flash(message, type = "success") {
    setToast({ message, type });
    setTimeout(() => setToast({ message: "", type: "" }), 2500);
  }

  // Load data
  useEffect(() => { loadData(); }, []);

  async function loadData() {
    try {
      const [entryRes, statRes, configRes] = await Promise.all([API.getEntries(), API.getWeekStats(), API.getConfig()]);
      setEntries(entryRes.entries);
      setStats(statRes.stats);
      if (configRes.config) {
        setConfig(configRes.config);
        if (configRes.config.triggers) setDynTriggers(configRes.config.triggers);
        if (configRes.config.stress_labels) setDynStress(configRes.config.stress_labels);
        if (configRes.config.reaction_options) setDynReactions(configRes.config.reaction_options);
        setCfgName(configRes.config.user_name || "");
        setCfgRole(configRes.config.user_role || "");
        setCfgContext(configRes.config.org_context || "");
        setCfgPersonality(configRes.config.coach_personality || "");
      }
      setLocal(entryRes.entries);
      setOnline(true);
    } catch {
      setEntries(getLocal());
      setOnline(false);
      computeLocalStats();
    }
    setLoaded(true);
  }

  function computeLocalStats() {
    const all = getLocal();
    const week = all.filter((e) => Date.now() - new Date(e.created_at || e.date) < 7 * 86400000);
    const count = week.length;
    const avgStress = count ? (week.reduce((s, e) => s + e.stress, 0) / count).toFixed(1) : null;
    const good = week.filter((e) => e.reaction === "paused" || e.reaction === "redirected").length;
    const bad = week.filter((e) => e.reaction === "snapped" || e.reaction === "absorbed").length;
    const tc = {};
    week.forEach((e) => (e.triggers || []).forEach((x) => (tc[x] = (tc[x] || 0) + 1)));
    const top = Object.entries(tc).sort((a, b) => b[1] - a[1])[0]?.[0] || null;
    setStats({ count, avgStress, goodReactions: good, badReactions: bad, topTrigger: top });
  }

  function resetForm() { setStress(0); setReaction(""); setTriggers([]); setSituation(""); }

  async function handleSave() {
    if (!stress || !reaction) return;
    const entry = { id: Date.now().toString(), stress, reaction, triggers, situation: situation.trim() };
    // Optimistic update
    const withDate = { ...entry, created_at: new Date().toISOString() };
    const updated = [withDate, ...entries];
    setEntries(updated);
    setLocal(updated);
    resetForm();
    setView("home");

    try {
      await API.createEntry(entry);
      flash("Guardado ✓");
      loadData(); // refresh stats
    } catch {
      flash("Guardado offline", "error");
    }
  }

  async function handleDelete(id) {
    const updated = entries.filter((e) => e.id !== id);
    setEntries(updated);
    setLocal(updated);
    setView("history");
    try { await API.deleteEntry(id); flash("Eliminado"); loadData(); } catch { flash("Eliminado offline", "error"); }
  }

  function coachFor(e) {
    const tl = (e.triggers || []).map((x) => dynTriggers.find((o) => o.id === x)?.label).filter(Boolean).join(", ");
    const rl = dynReactions.find((o) => o.id === e.reaction)?.label || "";
    const sl = dynStress.find((s) => s.level === e.stress)?.label || "";
    let m = `Tuve un momento de estrés ${sl.toLowerCase()}. `;
    if (tl) m += `Trigger: ${tl}. `;
    m += `Reacción: ${rl.toLowerCase()}. `;
    if (e.situation) m += `Lo que pasó: ${e.situation}`;
    setCoachSit(m);
    setCoachEntryId(e.id);
    setShowCoach(true);
  }

  // Derived
  const avg = stats.avgStress || "—";
  const topT = stats.topTrigger ? (dynTriggers.find((o) => o.id === stats.topTrigger)?.label || stats.topTrigger) : "—";

  if (!loaded) return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}><BG t={t} /><span style={{ color: t.lbl3, fontSize: 15, fontFamily: font }}>Cargando...</span></div>;
  if (showCoach) return <CoachChat t={t} situation={coachSit} entryId={coachEntryId} onClose={() => { setShowCoach(false); setCoachEntryId(null); }} />;

  // ─── DETAIL ───
  if (view === "detail" && selEntry) {
    const e = selEntry, sl = dynStress.find((s) => s.level === e.stress), rl = dynReactions.find((o) => o.id === e.reaction);
    return (
      <div style={{ minHeight: "100vh", fontFamily: font }}><BG t={t} /><Toast t={t} {...toast} />
        <Nav t={t} title="Detalle" onBack={() => setView("history")} />
        <div style={{ padding: "0 20px 30px", display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ ...mkG(t), padding: 20, ...r(0) }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 20 }}>
              <span style={{ fontSize: 13, color: t.lbl3, fontFamily: font }}>{new Date(e.created_at || e.date).toLocaleString("es", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</span>
              <span style={{ fontSize: 32 }}>{sl?.emoji}</span>
            </div>
            <div style={{ marginBottom: 18 }}><span style={cap(t)}>Estrés</span><p style={{ margin: "4px 0 0", fontSize: 17, fontWeight: 600, color: t.lbl1, fontFamily: font }}>{sl?.label}</p></div>
            <div style={{ marginBottom: 18 }}><span style={cap(t)}>Reacción</span><p style={{ margin: "4px 0 0", fontSize: 17, fontWeight: 500, color: t.lbl1, fontFamily: font }}>{rl?.emoji} {rl?.label}</p></div>
            {(e.triggers || []).length > 0 && <div style={{ marginBottom: 18 }}><span style={cap(t)}>Triggers</span><div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 6 }}>{e.triggers.map((x) => <span key={x} style={{ ...mkC(t, true), padding: "6px 12px", fontSize: 13, cursor: "default" }}>{dynTriggers.find((o) => o.id === x)?.label}</span>)}</div></div>}
            {e.situation && <div><span style={cap(t)}>Qué pasó</span><p style={{ margin: "4px 0 0", fontSize: 15, color: t.lbl2, lineHeight: 1.5, fontFamily: font }}>{e.situation}</p></div>}
          </div>
          <div style={{ display: "flex", gap: 8, ...r(1) }}>
            <button onClick={() => coachFor(e)} style={{ flex: 1, padding: 16, borderRadius: 14, border: "none", background: t.blue, color: "#FFF", fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: font, minHeight: 50 }}>🧠 Analizar con Coach</button>
            <button onClick={() => handleDelete(e.id)} style={{ ...mkG(t), padding: 16, width: 50, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", color: t.red, fontSize: 16, minHeight: 50 }}>🗑</button>
          </div>
        </div>
      </div>
    );
  }

  // ─── HISTORY ───
  if (view === "history") {
    return (
      <div style={{ minHeight: "100vh", fontFamily: font }}><BG t={t} /><Toast t={t} {...toast} />
        <Nav t={t} title="Historial" onBack={() => setView("home")} right={<span style={{ fontSize: 13, color: t.lbl3 }}>{entries.length}</span>} />
        <div style={{ padding: "0 20px 30px", display: "flex", flexDirection: "column", gap: 8 }}>
          {entries.length === 0 ? <div style={{ ...mkG(t), padding: 40, textAlign: "center" }}><p style={{ fontSize: 15, color: t.lbl3, margin: 0 }}>Aún no hay registros</p></div>
            : entries.map((e, i) => <Row key={e.id} t={t} entry={e} onClick={() => { setSelEntry(e); setView("detail"); }} sx={r(i)} />)}
        </div>
      </div>
    );
  }

  // ─── LOG ───
  if (view === "log") {
    const ok = stress > 0 && reaction;
    return (
      <div style={{ minHeight: "100vh", fontFamily: font }}><BG t={t} /><Toast t={t} {...toast} />
        <Nav t={t} title="Registrar" onBack={() => { resetForm(); setView("home"); }} />
        <div style={{ padding: "0 20px 30px", display: "flex", flexDirection: "column", gap: 28 }}>
          <div style={r(0)}><label style={cap(t)}>¿Qué tan fuerte fue?</label><StressSel t={t} value={stress} onChange={setStress} levels={dynStress} /></div>
          <div style={r(1)}><label style={cap(t)}>¿Cómo reaccionaste?</label><Chips t={t} options={dynReactions} value={reaction} onChange={setReaction} /></div>
          <div style={r(2)}><label style={cap(t)}>¿Qué lo provocó?</label><Chips t={t} options={dynTriggers} value={triggers} onChange={setTriggers} multi /></div>
          <div style={r(3)}><label style={cap(t)}>¿Qué pasó?</label>
            <textarea value={situation} onChange={(e) => setSituation(e.target.value)} placeholder="Describí brevemente..." rows={3}
              style={{ width: "100%", padding: "14px 16px", borderRadius: 14, ...mkG(t), color: t.lbl1, fontSize: 15, resize: "none", outline: "none", fontFamily: font, lineHeight: 1.5, boxSizing: "border-box" }} />
          </div>
          <div style={{ display: "flex", gap: 8, ...r(4) }}>
            <button onClick={handleSave} disabled={!ok} style={{
              flex: 1, padding: 16, borderRadius: 14, border: "none", background: ok ? t.blue : t.inputBg,
              color: ok ? "#FFF" : t.lbl3, fontSize: 17, fontWeight: 600, cursor: ok ? "pointer" : "default",
              fontFamily: font, minHeight: 50, transition: "all 0.2s ease",
            }}>Guardar</button>
            {situation.trim() && <button onClick={() => { handleSave(); setTimeout(() => coachFor({ stress, reaction, triggers, situation, id: Date.now().toString() }), 200); }} disabled={!ok} style={{
              ...mkG(t), padding: 16, width: 56, cursor: ok ? "pointer" : "default",
              border: `0.5px solid ${t.blue}40`, color: t.blue, fontSize: 18,
              display: "flex", alignItems: "center", justifyContent: "center", minHeight: 50,
            }}>🧠</button>}
          </div>
        </div>
      </div>
    );
  }

  // ─── SETTINGS ───
  if (view === "settings") {
    async function handleSaveConfig() {
      setSaving(true);
      try {
        await API.updateConfig({ user_name: cfgName, user_role: cfgRole, org_context: cfgContext, coach_personality: cfgPersonality });
        flash("Configuración guardada ✓");
        loadData();
      } catch { flash("Error al guardar", "error"); }
      setSaving(false);
    }
    const inputStyle = { width: "100%", padding: "14px 16px", borderRadius: 14, ...mkG(t), color: t.lbl1, fontSize: 15, resize: "vertical", outline: "none", fontFamily: font, lineHeight: 1.5, boxSizing: "border-box", border: `0.5px solid ${t.cardBorder}` };
    return (
      <div style={{ minHeight: "100vh", fontFamily: font }}><BG t={t} /><Toast t={t} {...toast} />
        <Nav t={t} title="Ajustes" onBack={() => setView("home")} />
        <div style={{ padding: "0 20px 30px", display: "flex", flexDirection: "column", gap: 24 }}>
          <div style={r(0)}><label style={cap(t)}>Nombre</label><input value={cfgName} onChange={(e) => setCfgName(e.target.value)} style={inputStyle} /></div>
          <div style={r(1)}><label style={cap(t)}>Rol</label><input value={cfgRole} onChange={(e) => setCfgRole(e.target.value)} style={inputStyle} /></div>
          <div style={r(2)}><label style={cap(t)}>Contexto organizacional</label><textarea value={cfgContext} onChange={(e) => setCfgContext(e.target.value)} rows={5} style={inputStyle} /></div>
          <div style={r(3)}><label style={cap(t)}>Personalidad del coach</label><textarea value={cfgPersonality} onChange={(e) => setCfgPersonality(e.target.value)} rows={4} style={inputStyle} /></div>
          <button onClick={handleSaveConfig} disabled={saving} style={{
            padding: 16, borderRadius: 14, border: "none", background: t.blue,
            color: "#FFF", fontSize: 17, fontWeight: 600, cursor: "pointer",
            fontFamily: font, minHeight: 50, opacity: saving ? 0.6 : 1, ...r(4),
          }}>{saving ? "Guardando..." : "Guardar"}</button>
        </div>
      </div>
    );
  }

  // ─── HOME ───
  return (
    <div style={{ minHeight: "100vh", fontFamily: font, paddingBottom: 30 }}><BG t={t} /><Toast t={t} {...toast} />
      <div style={{ padding: "32px 20px 8px", ...r(0) }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <h1 style={{ fontSize: 34, fontWeight: 700, margin: 0, letterSpacing: -0.5, color: t.lbl1 }}>Pulse</h1>
            <p style={{ fontSize: 15, color: t.lbl2, margin: "4px 0 0" }}>Tu espacio para pausar y pensar</p>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            {!online && <span style={{ ...mkC(t, false), padding: "6px 10px", fontSize: 11, color: t.orange, cursor: "default" }}>offline</span>}
            <button onClick={() => setView("settings")} style={{ background: "none", border: "none", color: t.lbl2, fontSize: 20, cursor: "pointer", padding: 4 }}>⚙</button>
          </div>
        </div>
      </div>

      <div style={{ padding: "16px 20px", display: "flex", gap: 10, ...r(1) }}>
        <button onClick={() => setView("log")} style={{ flex: 1, padding: "20px 16px", borderRadius: 16, background: t.blue, border: "none", color: "#FFF", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 8, fontFamily: font, minHeight: 44 }}>
          <span style={{ fontSize: 24 }}>📝</span><span style={{ fontSize: 15, fontWeight: 600 }}>Registrar</span><span style={{ fontSize: 12, opacity: 0.8 }}>30 segundos</span>
        </button>
        <button onClick={() => { setCoachSit(""); setCoachEntryId(null); setShowCoach(true); }} style={{ flex: 1, ...mkG(t), padding: "20px 16px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 8, fontFamily: font, minHeight: 44 }}>
          <span style={{ fontSize: 24 }}>🧠</span><span style={{ fontSize: 15, fontWeight: 600, color: t.lbl1 }}>Coach IA</span><span style={{ fontSize: 12, color: t.lbl2 }}>Repensar algo</span>
        </button>
      </div>

      <div style={{ padding: "8px 20px 12px" }}>
        <h2 style={{ ...cap(t), margin: "0 0 12px", ...r(2) }}>Esta semana</h2>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          {[
            { l: "Estrés promedio", v: avg !== null ? `${avg}/4` : "—", i: 3 },
            { l: "Trigger top", v: topT, i: 4 },
            { l: "Buenas reacciones", v: stats.goodReactions, c: t.green, i: 5 },
            { l: "A mejorar", v: stats.badReactions, c: stats.badReactions > stats.goodReactions ? t.red : t.orange, i: 6 },
          ].map((s) => (
            <div key={s.l} style={{ ...mkG(t), padding: "14px 16px", ...r(s.i) }}>
              <span style={cap(t)}>{s.l}</span>
              <p style={{ margin: "4px 0 0", fontSize: 24, fontWeight: 700, color: s.c || t.lbl1, fontFamily: font, letterSpacing: -0.5, fontVariantNumeric: "tabular-nums" }}>{s.v}</p>
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding: "8px 20px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, ...r(7) }}>
          <h2 style={{ ...cap(t), margin: 0 }}>Recientes</h2>
          {entries.length > 0 && <button onClick={() => setView("history")} style={{ background: "none", border: "none", color: t.blue, fontSize: 15, cursor: "pointer", fontFamily: font }}>Ver todo</button>}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {entries.length === 0
            ? <div style={{ ...mkG(t), padding: "32px 20px", textAlign: "center", ...r(8) }}><p style={{ fontSize: 28, margin: "0 0 8px" }}>🎯</p><p style={{ fontSize: 15, color: t.lbl2, margin: 0 }}>Registrá tu primer momento para ver patrones</p></div>
            : entries.slice(0, 3).map((e) => <Row key={e.id} t={t} entry={e} onClick={() => { setSelEntry(e); setView("detail"); }} />)
          }
        </div>
      </div>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById("root")).render(<Pulse />);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
